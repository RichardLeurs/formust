[package]
name = "formust-build"
version = "0.1.0"
edition = "2024"
description = "Formust's build types and cargo driver: cargo metadata, check, build and run with JSON messages parsed into diagnostics. No UI dependencies."

[dependencies]
libc = "0.2.191"
serde_json = "1.0.154"

[dev-dependencies]
formust-model = { path = "../formust-model" }
formust-rust = { path = "../formust-rust" }

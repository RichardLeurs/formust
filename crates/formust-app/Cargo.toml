[package]
name = "formust-app"
version = "0.1.0"
edition = "2024"

# The app runs as `formust` (bundle.sh copies it into Formust.app).
[[bin]]
name = "formust"
path = "src/main.rs"

[dependencies]
formust-ai = { version = "0.1.0", path = "../formust-ai" }
formust-build = { path = "../formust-build" }
formust-model = { path = "../formust-model" }
formust-rust = { path = "../formust-rust" }
formust-lsp = { version = "0.1.0", path = "../formust-lsp" }
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
muda = "0.21.2"
rfd = "0.17.2"
serde_json = "1.0.154"
toml = "0.8.2"
regex = "1.13"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
raw-window-handle = "0.6.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
libc = "0.2.191"
notify = "8.2.1"
trash = "5.2.9"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
